        fixtures: [F-OWNERSHIP-AMBIGUITY]
      - id: OWN-10
        quote: "Successful refresh removes stale content and accidental duplicate canonical representations."
      - id: OWN-12
        quote: "Cleanup: remove duplicate or obsolete managed content and unused exclusively owned resources"
        fixtures: [F-LIFECYCLE-FAILURE]
      - id: OWN-13
        quote: "Detach: release a whole binding's surviving managed content as-is into unmanaged Blender content"
