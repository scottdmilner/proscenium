# Requirement-to-test matrix (M1). The rendered view is requirements-matrix.md;
# tools/matrix.py checks this file and regenerates the view.
#
# Every bullet, paragraph, table row, and code block in PROJECT.md, spec/, and
# testing/ is either traced by a row (which quotes it) or listed under `excluded`
# with a reason, or with the IDs of the rows that already trace what it restates.
# Permissions, scope limits, and design guidance with no checkable outcome are
# excluded with a reason naming the milestone that should heed them.
# Short lead-in lines ending in ":" are skipped; their list items carry the content.
# spec/invariants.md is not traced here: each invariant bullet names its row IDs.
#
# Row fields (section-level values are defaults for its rows):
#   id            AREA-NN, stable; never reuse a retired ID.
#   quote         Distinctive text from the requirement, matched after stripping
#                 Markdown links, emphasis, and code marks, within `section`.
#   kind          behavior (default): checked by bespoke fixture tests.
#                 contract: a decision the spec says a milestone must settle; its
#                   oracle is that decision record, and the behavior it settles
#                   gets its own rows when decided.
#                 process: a development or test-process rule, checked by tooling or CI.
#   delivery      The milestone that delivers it (milestone Implements lines).
#   phase         1 or 2: the phase whose qualification covers it.
#   qualified_by  Behavior rows: derived (Phase 1 -> M12, Phase 2 -> M14).
#                 Other kinds: the milestone whose record or check confirms it.
#   fixtures      Bespoke fixtures from tests/fixtures/registry.py.
#   oracle        What the test or check asserts, from the spec or the fixture's construction.
#   note          Optional clarification shown with the oracle.
#   risk          high: a row M4's risk matrix marks (docs/plans/M04-prototypes.md#risk-matrix).
#
# Fixtures and oracles are recorded once known: today, the named contract fixtures
# and M1's own rows. The delivering milestone fills in the rest before implementing
# them; once it is listed in `started`, the checker requires an oracle on each of its
# rows and a fixture on each of its behavior rows.

started: [M1, M1b, M2, M3, M4]

requirements:

  # --- PROJECT.md ------------------------------------------------------------------------------

  - section: PROJECT.md#core-architecture
    phase: 1
    rows:
      - id: ARCH-01
        quote: "The USD hierarchy must remain accessible through source inspection"
        delivery: M7
      - id: ARCH-04
        quote: "Supported descendants must receive the correct ancestor state, including beneath unsupported ancestors."
        delivery: M6
      - id: ARCH-05
        quote: "Source hierarchy and selection identities are independent of display partitioning."
        delivery: M7
      - id: ARCH-06
        quote: "Tools address USD entities through the source selection model."
        kind: contract
        delivery: M2
        qualified_by: M4
        oracle: "The M2 decision record: the draft interaction contract (spec/interaction-contract.md), whose headless functions are how tools address source entities, and the M2 plan's Phase A log. M4 finalizes it."
      - id: ARCH-08
        quote: "Keep the performance tests around for later"
        oracle: "The measurement harness M4 builds (M4 plan, Phase C) stays in the repository and runs on the display representation in use; M12 records its Phase 1 baselines with it and M14 its Phase 2 targets."
        kind: process
        delivery: M4
        qualified_by: M14

  - section: PROJECT.md#phase-1--correct-snapshot-synchronization
    phase: 1
    rows:
      - id: PH1-01
        quote: "Manual refresh is required."
        delivery: M12
      - id: PH1-02
        quote: "The acceptance suite must pass"
        kind: process
        delivery: M12
        qualified_by: M12

  - section: PROJECT.md#phase-2--incremental-synchronization
    phase: 2
    delivery: M14
    rows:
      - id: PH2-02
        quote: "Preserve source selections where their source identities remain valid."
      - id: PH2-03
        quote: "Maintain sharing and reclaim obsolete managed resources without breaking sharing or other owners."
      - id: PH2-04
        quote: "Establish and meet representative performance targets"
        risk: high

  - section: PROJECT.md#compatibility-and-development
    kind: process
    delivery: M1
    phase: 1
    qualified_by: M12
    rows:
      - id: COMP-01
        quote: "Minimum Blender version: 5.2 LTS."
        oracle: "The manifest's blender_version_min is 5.2.0 and the built zip validates (tools/build_extension.py)."
      - id: COMP-02
        quote: "Use the OpenUSD version bundled with the supported Blender distribution."
        oracle: "Smoke tests find pxr inside Blender's bundle, and the extension zip contains no pxr or other USD build."
      - id: COMP-03
        quote: "Support macOS, Windows, and Linux."
        oracle: "CI runs the full suite, including binary smoke tests, on macOS, Windows, and Linux."
      - id: COMP-04
        quote: "Prefer Python-only implementation."
        kind: contract
        delivery: M1b
        qualified_by: M1b
        oracle: "The M1b decision record (DECISIONS.md \"Evaluation front end and core language\" and \"Python-only implementation\"), backed by the end-to-end prototype's correctness results and separate measurements."
      - id: COMP-06
        quote: "Compiled components link only against the OpenUSD libraries bundled with each supported Blender distribution."
        delivery: M1b
        oracle: "Per platform, in the bpy wheel and the Blender binary: the build audit finds the module importing USD symbols only from Blender's usd_ms library, with no embedded search path and no bundled USD, TBB, or Python library; at run time exactly one usd_ms image is loaded, it is the host's own, and it is the image that provides USD symbols to the module."
        note: "Applies to the M1b bridge; the compiled core M1b adopted inherits the checks."

  # --- spec/pipeline.md -----------------------------------------------------------------------

  - section: spec/pipeline.md#evaluated-source-snapshot
    delivery: M6
    phase: 1
    rows:
      - id: SNAP-08
        quote: "This model must not contain Blender datablock references."
      - id: SNAP-10
        quote: "Snapshot data cannot change during planning or application."
      - id: SNAP-11
        quote: "The snapshot keeps alive whatever storage it lends out, such as shared arrays."
      - id: SNAP-13
        quote: "Application does not retain borrowed buffers beyond the synchronization that supplied them."
        delivery: M7
      - id: SNAP-16
        quote: "Conversions made by Hydra filters, such as implicit surfaces or NURBS turned into meshes, are reported as approximations where inexact."
        note: "Applies since M1b adopted Hydra. M1b's prototype checks the case but is not production code, so M6 delivers it."
      - id: SNAP-17
        quote: "Hydra prim types the core does not translate"
        note: "Applies since M1b adopted Hydra. M1b's prototype checks the case but is not production code, so M6 delivers it."

  - section: spec/pipeline.md#display-plan
    delivery: M6
    phase: 1
    rows:
      - id: PLAN-08
        quote: "Planning is deterministic: the same snapshot, binding settings, and planning context yield the same plan."
      - id: PLAN-09
        quote: "Anything planning depends on must arrive through one of its three inputs."

  - section: spec/pipeline.md#blender-application
    delivery: M7
    phase: 1
    rows:
      - id: APP-05
        quote: "Report failures that only application can detect as diagnostics"
      - id: APP-06
        quote: "When a resource fails during application, abort the transaction unless the plan already authorized a fallback for that resource."
      - id: APP-08
        quote: "Application must not query USD to fill in unresolved source semantics."

  - section: spec/pipeline.md#why-the-boundary-is-enforced
    delivery: M5
    phase: 1
    rows:
      - id: BND-01
        quote: "Every feature extends both evaluation/planning and application explicitly."
        kind: process
        qualified_by: M12
      - id: BND-02
        quote: "All source-semantic diagnostics and known representation limitations exist before any Blender data is mutated."
      - id: BND-03
        quote: "A synchronization that fails for source reasons fails before touching the existing display."
        fixtures: [F-FAILED-SETTINGS]

  - section: spec/pipeline.md#synchronization-transaction
    delivery: M5
    phase: 1
    rows:
      - id: TXN-02
        quote: "Before publication, any failure preserves the previous published generation unchanged and attempts to dispose of prepared work."
        fixtures: [F-FAILED-SETTINGS, F-PUBLICATION-FAILURE, F-SHARED-MATERIAL-FAILURE]
      - id: TXN-03
        quote: "Failed disposal leaves leftovers persistently tracked as pending cleanup"
        fixtures: [F-PREPARATION-CLEANUP-FAILURE]
      - id: TXN-04
        quote: "For a first synchronization, no untracked partial content remains."
        fixtures: [F-PUBLICATION-FAILURE, F-PREPARATION-CLEANUP-FAILURE]
      - id: TXN-05
        quote: "Preparation never mutates resources reachable from the published generation unless a complete rollback mechanism covers the mutation."
        fixtures: [F-SHARED-MATERIAL-FAILURE]
        risk: high
      - id: TXN-06
        quote: "Publication switches the whole generation together"
        fixtures: [F-PUBLICATION-FAILURE]
        risk: high
      - id: TXN-07
        quote: "After publication, retirement failures do not fail the synchronization."
        fixtures: [F-RETIREMENT-FAILURE]
      - id: TXN-08
        quote: "Ownership tracking covers newly created prepared resources before subsequent fallible work"
        fixtures: [F-PREPARATION-CLEANUP-FAILURE]
      - id: TXN-09
        quote: "Reused published resources remain protected by the existing manifest and are never disposal candidates."
        fixtures: [F-PREPARATION-CLEANUP-FAILURE]
      - id: TXN-10
        quote: "Deferred disposal does not permit failed preparation to become visible or substitute for restoring any mutated published state."
        fixtures: [F-PREPARATION-CLEANUP-FAILURE]
      - id: TXN-12
        quote: "These guarantees apply equally to incremental mutations in Phase 2."
        delivery: M14
        phase: 2

  - section: spec/pipeline.md#diagnostics
    delivery: M5
    phase: 1
    rows:
      - id: DIAG-01
        quote: "Unsupported valid content."
      - id: DIAG-02
        quote: "Include binding, source path, property/asset identifier, severity, and fallback where applicable."
      - id: DIAG-03
        quote: "Aggregate repeated problems."
      - id: DIAG-04
        quote: "Source/display diagnostics belong to a published generation or to the last attempt and are kept separate from any attempt history."
        fixtures: [F-FAILED-SETTINGS]
      - id: DIAG-05
        quote: "Unresolved cleanup diagnostics also persist with pending-cleanup ownership information, so a later attempt cannot erase pending work."
        fixtures: [F-PREPARATION-CLEANUP-FAILURE]
      - id: DIAG-06
        quote: "Report current cleanup status separately from historical attempt results and deduplicate by operation and resource."
        fixtures: [F-PREPARATION-CLEANUP-FAILURE, F-RETIREMENT-FAILURE]
      - id: DIAG-07
        quote: "An unchanged refresh produces equivalent deduplicated source/display diagnostics."
        fixtures: [F-NO-OP-REFRESH]
      - id: DIAG-08
        quote: "resolved cleanup diagnostics are removed rather than accumulated as history."
        fixtures: [F-PREPARATION-CLEANUP-FAILURE]
      - id: DIAG-09
        quote: "Success: no diagnostics in any category other than source state."
      - id: DIAG-10
        quote: "Completed with issues: at least one unsupported, approximation, lossy-conversion, missing-dependency, invalid-data, or pending-cleanup diagnostic, but no fatal failure."
      - id: DIAG-11
        quote: "Fatal failure, including an unavailable source."
        fixtures: [F-OFFLINE]
      - id: DIAG-13
        quote: "Never pass unsafe invalid geometry into Blender or silently present unsupported translation as exact."
        delivery: M8

  # --- spec/source-access.md ------------------------------------------------------------------

  - section: spec/source-access.md#bindings-and-source-access
    delivery: M3
    phase: 1
    rows:
      - id: BIND-02
        quote: "Root-layer files: .usd, .usda, .usdc."
        fixtures: [F-MULTI-BINDING]
        oracle: "Bindings on the .usd, .usda, and .usdc copies of the fixture's scene each acquire a stage that composes the same values."
      - id: BIND-03
        quote: "Caller-supplied in-memory stages without requiring file reopening."
        phase: 2
        fixtures: [F-MULTI-BINDING]
        oracle: "A binding with the caller's stage attached composes the caller's unsaved root-layer edit, which a stage reopened from the file would not."
      - id: BIND-04
        quote: "Load-all or load-no-payload policy."
        fixtures: [F-MULTI-BINDING]
        oracle: "A load-all and a load-none binding on the same file compose the fixture's payload content by their own policy."
      - id: BIND-05
        quote: "Explicit evaluation time code, including the USD default time code."
        fixtures: [F-MULTI-BINDING]
        oracle: "synchronize accepts the USD default time code and numeric time codes, including a non-integer one, and the attempt is made at exactly that time code, as its last attempt records."
        delivery: M5
      - id: BIND-06
        quote: "Coordinate-conversion and purpose/display settings."
        fixtures: [F-MULTI-BINDING]
        oracle: "Each binding keeps its own units, up-axis, and purpose settings: setting one binding's leaves the others' as they were."
        delivery: M6
      - id: BIND-11
        quote: "UV-set names, which decide which untyped primvars display as UV sets"
        delivery: M8
      - id: BIND-07
        quote: "Multiple independent bindings, including bindings using the same source."
        fixtures: [F-MULTI-BINDING]
        oracle: "Two bindings with the same file source and one with a stage over that file attached each have their own evaluation stage, distinct from the others' and from the attached stage."
      - id: BIND-08
        quote: "The default scope is the entire available stage."
        fixtures: [F-MULTI-BINDING]
        oracle: "A binding with default settings acquires a stage with no population mask restriction, composing every prim the fixture's scene defines."
      - id: BIND-09
        quote: "Consume existing composition and variant selections. Do not author composition arcs or variant selections."
        fixtures: [F-MULTI-BINDING]
        oracle: "After acquisitions under both payload policies, no layer of the source is dirty or changed on disk, and the stage composes the scene's authored variant selections."
      - id: BIND-10
        quote: "Binding configuration must not cross-contaminate other bindings."
        fixtures: [F-MULTI-BINDING]
        oracle: "Changing one binding's requested settings or payload policy leaves every other binding's configuration, stage, and stage settings unchanged."

  - section: spec/source-access.md#synchronization-api
    delivery: M3
    phase: 1
    rows:
      - id: API-01
        quote: "Callers reach a binding through a binding handle: an immutable value that holds only the binding's persistent identifier, never a Blender datablock or cached binding state."
        fixtures: [F-BINDING-STATE]
        oracle: "A handle compares equal to one built from the same identifier, and stays usable across undo, redo, and save/reopen while its binding exists."
      - id: API-02
        quote: "The time code is the attempt's, not a setting of the binding"
        fixtures: [F-BINDING-STATE]
        oracle: "After synchronize(t) for any t, the default time code included, the binding's configuration is unchanged, and the attempt used the binding's requested settings, such as its payload policy."
      - id: API-03
        quote: "The requested settings (payload policy, conversion, purpose, UV-set names) change only through set_settings(...), which records them without synchronizing."
        fixtures: [F-BINDING-STATE]
        oracle: "set_settings changes the requested settings and nothing else: the published generation, last attempt, and live stage are unchanged, and no synchronization runs."
      - id: API-06
        quote: "A handle whose binding no longer exists, for example after undo or binding removal, raises when used."
        fixtures: [F-BINDING-STATE]
        oracle: "After a binding's creation is undone, every method of a handle to it raises, as does an equal handle made afterwards."
      - id: API-08
        quote: "or binding removal, raises when used."
        delivery: M11
        fixtures: [F-BINDING-STATE]
        oracle: "After a binding is removed, every method of a handle to it raises, as does an equal handle made afterwards."
        note: "API-06's removal half: removing a binding is M11's lifecycle operation."
      - id: API-07
        quote: "reload(layers=None) rereads the binding's source layers from disk on request"
        fixtures: [F-BINDING-STATE]
        oracle: "reload leaves the requested settings, published generation, and last attempt unchanged and runs no synchronization; the next synchronize displays the reloaded layers."
      - id: API-04
        quote: "An expected failure, such as an unavailable source, is a result, not an exception."
        delivery: M5
      - id: API-05
        quote: "Exceptions report misuse only, such as a call made during another synchronization."
        delivery: M5

  - section: spec/source-access.md#source-consistency
    delivery: M3
    phase: 1
    rows:
      - id: CONS-01
        quote: "Synchronization is synchronous and non-reentrant."
        delivery: M5
      - id: CONS-03
        quote: "Where a source change during evaluation can be detected, the attempt is discarded before publication."
        delivery: M5
        fixtures: [F-SOURCE-CHANGE]
        oracle: "When the fixture changes a contributing layer while the binding evaluates, the attempt fails before publication with a diagnostic naming the layer, and the published generation is unchanged."

  - section: spec/source-access.md#source-identity
    delivery: M3
    phase: 2
    rows:
      - id: SID-03
        quote: "A source key names one attached source within a .blend. Several bindings may share a key; attaching a stage under a key attaches it to every binding with that key."
        note: "SID-03 to SID-07 replace SID-02 (retired), the contract row M3 settled."
        fixtures: [F-REATTACH]
        oracle: "Attaching a stage under a key attaches it to both bindings created with that key, and not to a binding with another key."
      - id: SID-04
        quote: "Reattachment requires an exact key match."
        fixtures: [F-REATTACH]
        oracle: "Attaching under a key that differs from a binding's, even only in case or whitespace, leaves that binding unattached."
      - id: SID-05
        quote: "The root-layer identifier is informative only: it is never used to find the bindings for a stage."
        fixtures: [F-REATTACH]
        oracle: "Attaching a stage whose root layer matches a binding's stored identifier, under a different key, does not attach it to that binding."
      - id: SID-06
        quote: "Attaching a stage whose root-layer identifier differs from the stored one requires explicit confirmation from the caller. Without it, the attachment fails and the bindings are unchanged."
        fixtures: [F-REATTACH]
        oracle: "Attaching a stage with a different root-layer identifier under an existing key fails without confirmation and leaves every binding's attachment unchanged; with confirmation it attaches, and the stored identifier becomes the new one."
      - id: SID-07
        quote: "Replacing the attached stage preserves stored source selections; they resolve against the next published generation."
        fixtures: [F-REATTACH]
        oracle: "After the attached stage is replaced, the persistent selection's entries for those bindings are unchanged."

  - section: spec/source-access.md#copied-bindings
    delivery: M3
    phase: 1
    fixtures: [F-OWNERSHIP-AMBIGUITY]
    rows:
      - id: COPY-01
        quote: "do not assume they guarantee uniqueness."
        oracle: "Each copy route F-OWNERSHIP-AMBIGUITY builds (duplicate collection, full-copy and linked-copy scene, append from another .blend, a record copied through Python) leaves candidates sharing one binding identity, and detection finds every candidate."
      - id: COPY-02
        quote: "A binding whose identity is not unique is disabled pending repair"
        oracle: "Each candidate the rule does not keep canonical (every candidate, when it cannot decide) is disabled pending repair: its display and records are unchanged, it is reported as not canonical, refresh of a binding with no canonical candidate is refused with a diagnostic naming the ambiguity, and the state survives save/reopen."
      - id: COPY-03
        quote: "A deterministic, documented rule decides which candidate remains canonical. If the rule cannot decide, all candidates are disabled."
        oracle: "For each copy route, the canonical candidate is the one the rule in Copied Bindings names, and it is the same on repeated detection and after save/reopen; where the rule cannot decide, every candidate is disabled."
      - id: COPY-04
        quote: "Copies are never automatically claimed, merged, or deleted."
        oracle: "After detection, every candidate's binding record, manifest, and managed content are unchanged: nothing is claimed, merged, or deleted."
      - id: COPY-05
        quote: "until the user makes it a new binding or detaches it."
        delivery: M11
      - id: COPY-13
        quote: "each scene's binding record for it, and each destination collection tagged with it that no binding record names"
        oracle: "On each copy route F-OWNERSHIP-AMBIGUITY builds, the reported candidates are the scenes holding a binding record for the identity, in the order found, then the tagged collections no record names: two after a collection copy or a scene copy, three after a record copy."
      - id: COPY-14
        quote: "A binding's identity is not unique when it has two or more candidates, or two or more binding indexes name it."
        oracle: "A binding with one candidate is unique and enabled, with its destination removed or the index unreadable; one candidate that two indexes name is disabled; nothing is reported for a unique identity."
      - id: COPY-15
        quote: "A binding's handle reaches its canonical candidate."
        oracle: "On each route where the rule decides, the handle's lookups reach the original, its scene lists it and the copy's scene doesn't; where it can't, each scene with a candidate lists the binding; copied() reports every candidate, and which is canonical or that none is."
      - id: COPY-16
        quote: "A binding with no canonical candidate refuses synchronization, reloading, and settings changes with a fatal diagnostic naming its candidates, before accessing its source."
        oracle: "For a binding the rule can't decide, synchronize, reload, and set_settings return a fatal failure with one copied-binding diagnostic naming its candidates' scenes and destinations, no source stage is made for it, and requested_settings raises."
      - id: COPY-17
        quote: "Whether a candidate is disabled is derived from the records whenever they are read, never stored"
        oracle: "Detection leaves every record in the file as it was, and gives the same report after the state is rebuilt and after save/reopen, apart from an appended index host, which the save drops."
      - id: COPY-18
        quote: "Detection runs when a .blend is loaded, after undo and redo, when scenes are added or removed, and before each synchronization."
        oracle: "A collection copied by script after the bindings' state was built is reported at the next synchronization, which, for the canonical candidate, succeeds."

  - section: spec/source-access.md#canonical-candidate
    delivery: M3
    phase: 1
    fixtures: [F-OWNERSHIP-AMBIGUITY]
    rows:
      - id: COPY-06
        quote: "with one entry per binding identity naming that binding's destination"
        oracle: "On every copy route F-OWNERSHIP-AMBIGUITY builds, the binding index is not copied: the .blend has one index, whose entry for the identity names the original destination, before and after save/reopen."
      - id: COPY-07
        quote: "Creating a binding adds its index entry."
        fixtures: [F-BINDING-STATE]
        oracle: "After a binding is created, the index has one entry for its identity, naming its destination, and the entry survives save/reopen."
      - id: COPY-08
        quote: "Removing a binding removes its entry."
        delivery: M11
      - id: COPY-09
        quote: "A candidate is canonical when the index names its destination and its binding record and destination refer to each other."
        oracle: "On each copy route F-OWNERSHIP-AMBIGUITY builds, including the full-copy scene and append, which copy a binding's record and destination together, the original binding is canonical and stays enabled, and every copy is disabled pending repair, on repeated detection and after save/reopen."
      - id: COPY-10
        quote: "then the one candidate whose binding record and destination refer to each other is canonical."
        oracle: "With the index host deleted, or the index entry naming no destination, the canonical candidate on each route F-OWNERSHIP-AMBIGUITY builds is the one candidate whose record and destination refer to each other; where there are two or none, every candidate is disabled pending repair."
      - id: COPY-11
        quote: "Otherwise the rule cannot decide, and all candidates are disabled."
        oracle: "With two indexes naming the identity (an index host appended from another .blend, before the save drops it), an index naming a destination whose record does not refer back, or an index that can't be read beside a full-copy scene, every candidate is disabled pending repair."
      - id: COPY-19
        quote: "A write to the canonical candidate's binding records restores its missing index entry"
        oracle: "With the index's Text removed, set_settings on the binding writes a new index whose entry names its destination, and the next full-copy scene leaves the original canonical; an entry naming no destination is kept, and detection alone writes no index."
      - id: COPY-12
        quote: "A binding linked from another .blend is not a candidate."
        oracle: "Linking a collection holding a binding with a local binding's identity leaves the local binding canonical and enabled, and the linked binding is not reported as a candidate."

  - section: spec/source-access.md#source-stages
    delivery: M3
    phase: 1
    rows:
      - id: SRC-01
        quote: "A binding with a file source opens its source stage outside every USD stage cache, at its first synchronization, including the first after a .blend is reopened, and keeps and reuses it across synchronizations. It never takes the stage from a stage cache, places it in one, or shares it with other bindings or tools."
        note: "SRC-01 to SRC-08 replace MEM-01, MEM-02, MEM-04 to MEM-08, FILE-04, and FILE-08 (retired): the in-memory and file-backed contracts became one kind of binding with the user on 2026-10-18."
        fixtures: [F-CACHED-STAGE]
        oracle: "With the ambient stage cached in UsdUtils.StageCache and its cache context active, the binding's source stage is not the ambient stage and is in no stage cache, the same stage is returned on the next acquisition, two bindings on the file get different stages, and the ambient stage's settings and values equal ambient_values."
      - id: SRC-02
        quote: "The binding holds the attached stage until the caller releases it with release(key)"
        phase: 2
        fixtures: [F-REATTACH]
        oracle: "After the caller drops every reference to the attached stage, the binding still has it as its live stage and its layers stay loaded, unsaved edits included; after release(key), every binding with the key is unattached, the stage expires, and its layers are freed. A binding whose creation is undone keeps its attachment, drops its evaluation stage, and is attached again after redo; release(key) releases it meanwhile."
      - id: SRC-03
        quote: "After a .blend is reopened, a binding with an attached source reports its source as unavailable until the caller attaches a stage."
        phase: 2
        fixtures: [F-REATTACH]
        oracle: "After save/reopen, a binding with an attached source reports its source unavailable until a stage is attached under its key; refreshing it before then gives a diagnostic and changes no published state."
      - id: SRC-04
        quote: "Do not author changes to an attached stage's layers or change its stage settings"
        phase: 2
        fixtures: [F-PRIVATE-STAGE]
        oracle: "Each synchronization, under either payload policy, leaves caller_settings and layer_contents of the attached stage as they were before it."
      - id: SRC-05
        quote: "Evaluate the source stage's composed content as the source stage presents it, including the opinions in its session layer and the anonymous layers beneath it, except that the binding's payload policy replaces the source stage's load rules."
        fixtures: [F-PRIVATE-STAGE, F-CACHED-STAGE]
        oracle: "For an attached source, the evaluation stage composes the generator's caller_values, including the unsaved root edit and the session-layer opinions, except payload content, which follows the binding's payload policy. For a file source, an opinion authored in the source stage's session layer is composed over the source's layers, and one in the ambient stage's session layer is not."
      - id: SRC-06
        quote: "Each binding evaluates an evaluation stage, which composes the source stage's root and session layers and is opened outside every USD stage cache with the source stage's resolver context."
        phase: 2
        fixtures: [F-PRIVATE-STAGE]
        oracle: "For an attached source, the evaluation stage is not the attached stage, its root and session layers are the attached stage's layer objects, it is in no stage cache, and its resolver context equals the attached stage's."
      - id: SRC-07
        quote: "At each synchronization, the evaluation stage's population mask, muted layers, and interpolation type match the source stage's."
        phase: 2
        fixtures: [F-PRIVATE-STAGE]
        oracle: "At each synchronization, the evaluation stage's population mask, muted layers, and interpolation type equal the attached stage's, including after the caller changes them between synchronizations; the animated value at time 5 matches caller_anim_at_5."
      - id: SRC-08
        quote: "Multiple bindings on the same source may use different payload policies without affecting each other or the source stage."
        phase: 2
        fixtures: [F-PRIVATE-STAGE]
        oracle: "A load-all and a load-none binding on the attached stage each compose payload content by their own policy, and neither changes the other's evaluation stage or the attached stage's load set."

  - section: spec/source-access.md#layer-state-and-reloading
    delivery: M3
    phase: 1
    rows:
      - id: LAYER-01
        quote: "A binding displays its source's layers as they are loaded, including unsaved in-process edits in dirty layers and the content a layer had when it was read, even if its file has changed since. Synchronization never reloads a layer."
        note: "LAYER-01 to LAYER-07 replace FILE-01, FILE-02, FILE-03, FILE-05, FILE-06, and FILE-07 (retired), the refresh contract settled with the user on 2026-10-18."
        fixtures: [F-DIRTY-LAYER]
        oracle: "A binding with the file source acquires a stage composing in_process_values, sub.usda included at its loaded value 1 though its file says 2, and acquiring again changes no layer and sends no change notice."
      - id: LAYER-02
        quote: "When a synchronization displays dirty layers, it reports an informational source-state diagnostic naming them."
        delivery: M5
        fixtures: [F-DIRTY-LAYER]
        oracle: "A synchronization under F-DIRTY-LAYER succeeds and reports one source-state diagnostic naming the dirty contributing layers (ref, pay, and var_a under load-all)."
      - id: LAYER-03
        quote: "Layers are reloaded only on request, through the binding's reload"
        fixtures: [F-DIRTY-LAYER]
        oracle: "After reload(), the binding's stage composes disk_values with the changed_on_disk value; each layer in dirty_contributing is clean with its disk value; var_b (dirty_not_contributing) keeps its edit; the binding stage's session-layer opinion is still composed."
      - id: LAYER-04
        quote: "The contributing layers are the non-anonymous layers the binding's evaluation stage composes under its payload policy. A layer reached only through an unloaded payload does not contribute, and anonymous layers are never reloaded."
        fixtures: [F-DIRTY-LAYER]
        oracle: "Under load-none, reload() leaves pay.usda dirty with its edit and rereads ref and var_a."
      - id: LAYER-05
        quote: "reload(layers) rereads only the named layers, each of which must be a contributing layer of the binding. Naming any other layer is misuse: the call raises and reloads nothing."
        fixtures: [F-DIRTY-LAYER]
        oracle: "reload([sub]) rereads only sub.usda: ref, pay, and var_a keep their edits. Naming var_b, an anonymous layer, or an unknown identifier, alone or with sub, raises and leaves every layer as it was."
      - id: LAYER-06
        quote: "Every stage that composes a reloaded layer sees its new content, including an attached stage. This is the only effect source access may have that other stages can observe"
        fixtures: [F-CACHED-STAGE, F-DIRTY-LAYER]
        oracle: "After a reload rereads a layer, another stage composing it (the caller's stage in F-DIRTY-LAYER, the ambient stage in F-CACHED-STAGE) composes its new content, and that stage's caller_settings are unchanged."
      - id: LAYER-07
        quote: "After a reload, a binding's reused evaluation stage displays the same result as a stage newly opened from the same files with the same anonymous layers."
        fixtures: [F-DIRTY-LAYER, F-CACHED-STAGE]
        oracle: "After reload(), the binding's reused stage composes the same values as a stage opened fresh from the same files with the same session-layer opinions, and the session-layer opinion survives the reload."

