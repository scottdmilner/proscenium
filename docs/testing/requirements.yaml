      - id: ICON-03
        quote: "It never reads the display, the plan, or the snapshot"
      - id: ICON-04
        quote: "It does not depend on the compiled core: it shares no code with it"
        kind: process
        qualified_by: M7
        note: "COMP-06 covers its linkage."
      - id: ICON-05
        quote: "so paths never pass through Python between the layers"
        kind: process
        qualified_by: M7
      - id: ICON-06
        quote: "The inspection layer is read-only."
        fixtures: [F-KIND-HIERARCHY, F-UNIVERSE-MEMBERSHIP]
        oracle: "After kind-level select_targets calls, the stage's layers are not dirty and its load set and population mask are unchanged."
      - id: ICON-32
        quote: "for a file source, the stage the binding opened and reuses across refreshes"
        delivery: M3
        fixtures: [F-BINDING-STATE]
        oracle: "After the first synchronization of a binding with a file source, its live stage is the source stage it synchronized with, and it is the same stage after a second refresh."
      - id: ICON-33
        quote: "A binding with a file source has no live stage until its first synchronization, including after a .blend is reopened."
        delivery: M3
        fixtures: [F-BINDING-STATE]
        oracle: "Before its first synchronization, and after reopening until a refresh, a binding with a file source has no live stage."
      - id: ICON-07
        quote: "and for an attached source, the caller's stage."
        delivery: M3
        phase: 2
        fixtures: [F-REATTACH]
        oracle: "A binding with an attached source has the caller's attached stage as its live stage, not its evaluation stage."
      - id: ICON-34
        quote: "Callers get a binding's live stage from the binding, which never places it in a stage cache."
        delivery: M3
        fixtures: [F-CACHED-STAGE]
        oracle: "After synchronization, the stage the binding handle returns as live for a file source is the source stage the binding opened, is not in UsdUtils.StageCache, and is not the ambient stage."

