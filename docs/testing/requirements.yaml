# Requirement-to-test matrix (M1). The rendered view is requirements-matrix.md;
# tools/matrix.py checks this file and regenerates the view.
#
# Every bullet, paragraph, table row, and code block in PROJECT.md, spec/, and
# testing/ is either traced by a row (which quotes it) or listed under `excluded`
# with a reason, or with the IDs of the rows that already trace what it restates.
# Permissions, scope limits, and design guidance with no checkable outcome are
# excluded with a reason naming the milestone that should heed them.
# Short lead-in lines ending in ":" are skipped; their list items carry the content.
# spec/invariants.md is not traced here: each invariant bullet names its row IDs.
#
# Row fields (section-level values are defaults for its rows):
#   id            AREA-NN, stable; never reuse a retired ID.
#   quote         Distinctive text from the requirement, matched after stripping
#                 Markdown links, emphasis, and code marks, within `section`.
#   kind          behavior (default): checked by bespoke fixture tests.
#                 contract: a decision the spec says a milestone must settle; its
#                   oracle is that decision record, and the behavior it settles
#                   gets its own rows when decided.
#                 process: a development or test-process rule, checked by tooling or CI.
#   delivery      The milestone that delivers it (milestone Implements lines).
#   phase         1 or 2: the phase whose qualification covers it.
#   qualified_by  Behavior rows: derived (Phase 1 -> M12, Phase 2 -> M14).
#                 Other kinds: the milestone whose record or check confirms it.
#   fixtures      Bespoke fixtures from tests/fixtures/registry.py.
#   oracle        What the test or check asserts, from the spec or the fixture's construction.
#   note          Optional clarification shown with the oracle.
#
# M4 adds a field marking the high-risk rows from its risk matrix.
#
# Fixtures and oracles are recorded once known: today, the named contract fixtures
# and M1's own rows. The delivering milestone fills in the rest before implementing
# them; once it is listed in `started`, the checker requires an oracle on each of its
# rows and a fixture on each of its behavior rows.

started: [M1]

