[project]
name = "proscenium_sync"
version = "0.1.0"
description = "The bindings of OpenUSD stages to Blender, their synchronization, and the compiled core"
license = "MIT"
requires-python = ">=3.13"
# bpy and pxr come with Blender, so nothing ships.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proscenium_sync"]
# Each directory's README, for developers, and the compiled core's sources and dotfiles: only its module ships.
exclude = ["README.md", ".*", "*.cpp", "*.h", "CMakeLists.txt"]

# Builds the compiled core and tags the wheel for this platform (hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]
