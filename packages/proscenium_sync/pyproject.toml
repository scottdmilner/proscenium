[project]
name = "proscenium_sync"
version = "0.1.0"
description = "The bindings of OpenUSD stages to Blender, their synchronization, and the planner"
license = "MIT"
requires-python = ">=3.13"
# bpy and pxr come with Blender, so nothing ships.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proscenium_sync"]
# Each directory's README, for developers, and the planner's sources and dotfiles: only its module ships.
exclude = ["README.md", ".*", "*.cpp", "*.h", "CMakeLists.txt"]

# Builds the planner and tags the wheel for this platform (hatch_build.py).
[tool.hatch.build.targets.wheel.hooks.custom]

# This package's import rules (README.md#import-rules), which `lint-imports --config` checks with this file (pre-commit).
# The root pyproject.toml holds the rules between packages. Every import counts, at module level, in functions, and
# under TYPE_CHECKING, and the layers contract follows chains of imports too.
[tool.importlinter]
root_package = "proscenium_sync"
include_external_packages = true  # so the bpy-free contracts see Blender's modules

# The tiers, highest first. Units of one tier share a line, so they don't import each other. Exhaustive: a module
# beside the units that no tier lists fails.
[[tool.importlinter.contracts]]
name = "proscenium_sync's tiers"
type = "layers"
containers = ["proscenium_sync"]
layers = [
    "registration",
    "bindings",
    "synchronization | interaction",
    "runtime",
    "persistence",
    "planner | source_access | results",  # bpy-free
]
exhaustive = true

# A unit whose __init__.py exports names rather than all its modules is reached only through it: no other unit
# imports its modules. ty rejects an import of a name the __init__.py doesn't define.
[[tool.importlinter.contracts]]
name = "bindings is reached through its exports"
type = "protected"
protected_modules = ["proscenium_sync.bindings.*"]
allowed_importers = ["proscenium_sync.bindings"]

[[tool.importlinter.contracts]]
name = "synchronization is reached through its exports"
type = "protected"
protected_modules = ["proscenium_sync.synchronization.*"]
allowed_importers = ["proscenium_sync.synchronization"]

[[tool.importlinter.contracts]]
name = "results is reached through its exports"
type = "protected"
protected_modules = ["proscenium_sync.results.*"]
allowed_importers = ["proscenium_sync.results"]

[[tool.importlinter.contracts]]
name = "The planner is reached through its exports"
type = "protected"
protected_modules = ["proscenium_sync.planner.*"]
allowed_importers = ["proscenium_sync.planner"]

# The bpy-free code imports no Blender module, even through another module.
[[tool.importlinter.contracts]]
name = "proscenium_sync's lowest tier imports no Blender module"
type = "forbidden"
source_modules = ["proscenium_sync.planner", "proscenium_sync.source_access", "proscenium_sync.results"]
forbidden_modules = ["bpy", "mathutils", "idprop", "gpu", "gpu_extras", "bpy_extras", "blf", "bmesh"]

[[tool.importlinter.contracts]]
name = "proscenium_sync's __init__.py imports no Blender module"
type = "forbidden"
source_modules = ["proscenium_sync"]
forbidden_modules = ["bpy", "mathutils", "idprop", "gpu", "gpu_extras", "bpy_extras", "blf", "bmesh"]
as_packages = false  # the module alone, not its descendants

[[tool.importlinter.contracts]]
name = "A unit's modules import each other without cycles"
type = "acyclic_siblings"
ancestors = ["proscenium_sync.*"]
