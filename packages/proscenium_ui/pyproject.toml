[project]
name = "proscenium_ui"
version = "0.1.0"
description = "Widgets an add-on places in Blender's editors: the scene graph and the property viewer"
license = "MIT"
requires-python = ">=3.13"
# bpy, pxr, and numpy come with Blender, so nothing ships.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proscenium_ui"]
exclude = ["README.md"]  # each directory's README, for developers
