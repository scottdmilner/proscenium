# Single source of truth for lint checks: runs as a git hook and in CI
# (`uv run pre-commit run --all-files`). Hooks use the tool versions pinned in
# uv.lock via `uv run --frozen`, so `uv sync` first.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      # The compiled core's C++ (src/proscenium/core/); its .clang-format and .clang-tidy hold the style and checks.
      - id: clang-format
        name: clang-format
        entry: uv run --frozen clang-format -i
        language: system
        files: ^src/proscenium/core/.*\.(cpp|h)$
      - id: clang-tidy
        name: clang-tidy
        entry: uv run --frozen python tools/clang_tidy.py
        language: system
        files: ^(src/proscenium/core/(.*\.(cpp|h)|CMakeLists\.txt|\.clang-tidy)|tools/(clang_tidy|native_build|blender_deps)\.py)$
        pass_filenames: false
      - id: matrix
        name: requirement matrix
        entry: uv run --frozen python tools/matrix.py check
        language: system
        files: ^(docs/.*\.(md|yaml)|tests/fixtures/registry\.py|tools/matrix\.py)$
        pass_filenames: false
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
