schema_version = "1.0.0"

id = "proscenium"
version = "0.1.0"
name = "Proscenium"
tagline = "One-way synchronization of composed OpenUSD stages into Blender"
maintainer = "Scott Milner"
type = "add-on"
blender_version_min = "5.2.0"
license = ["SPDX:MIT"]

# Uses the OpenUSD bundled with Blender; never bundle wheels for pxr/usd-core.
# tools/build_extension.py rewrites the lines between the markers from uv.lock;
# change runtime dependencies in pyproject.toml, not here. This block holds
# top-level keys, so it must be placed above the first table.
# --- begin generated by tools/build_extension.py ---
# --- end generated ---

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "/*.zip",
  "*.blend[1-9]",
]
