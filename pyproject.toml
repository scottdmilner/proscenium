[project]
name = "proscenium"
version = "0.1.0"
description = "Blender extension for one-way synchronization of composed OpenUSD stages into Blender"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# Runtime dependencies are distributed with the extension. Keep this empty
# unless a package is meant to ship.
dependencies = []

[dependency-groups]
dev = [
    "bpy~=5.2",
    "bpy-site-packages",
    "fake-bpy-module-5-2>=20260730",
    "packaging>=26.3",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "types-pyyaml>=6.0.12.20260906",
    "types-usd>=24.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proscenium"]

[tool.uv.sources]
bpy-site-packages = { path = "tools/bpy-site-packages" }

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tools", "tools/feasibility", "tests"]

[tool.ruff.lint]
future-annotations = true
select = ["E", "W", "F", "I", "ANN", "B", "UP", "TC"]
ignore = [
    "ANN401", # Any is the honest type for untyped pxr/bpy objects
]

[tool.ruff.lint.isort]
known-first-party = ["proscenium"]
known-third-party = ["bpy", "pxr"]

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["tools", "tools/feasibility", "tests"]

[tool.pyright]
# Pylance configuration
extraPaths = ["tools", "tools/feasibility", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]  # tests/ for the support and fixtures packages
# importlib mode lets test files in different layers share a basename.
addopts = ["--strict-markers", "--import-mode=importlib"]
# bpy_free, blender, and isolated are applied from the test's directory (tests/conftest.py).
markers = [
    "bpy_free: runs without Blender; Blender modules are blocked",
    "blender: in-process bpy wheel, reused process with explicit state reset",
    "isolated: fresh Blender process (bpy wheel or binary) per test",
    "alab: requires PROSCENIUM_ALAB_ROOT",
    "slow: long-running",
]
