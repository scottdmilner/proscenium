[project]
name = "proscenium"
version = "0.1.0"
description = "Blender extension for one-way synchronization of composed OpenUSD stages into Blender"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# Runtime dependencies are distributed with the extension. Keep this to the
# workspace's packages unless another package is meant to ship.
dependencies = ["proscenium_cook", "proscenium_sync", "proscenium_ui"]

[dependency-groups]
# Sync `dev` (the default), which includes the others but `icons`. `lint` alone fails `ty check`: it also checks
# tests/ and tools/feasibility/, so it needs pytest, python-dotenv, psutil, and numpy (which comes with bpy).
# Revisit once the Hydra bridge in tools/feasibility/ is decommissioned.
build = [
    "cmake>=3.26",  # cmake and ninja build compiled modules (tools/native_build.py)
    "hatchling>=1.27",  # builds proscenium_sync's wheel in this environment (tools/build_extension.py)
    "ninja>=1.13.2",
    "packaging>=26.3",
]
stubs = [
    "fake-bpy-module-5-2>=20260730",
    "types-pyyaml>=6.0.12.20260906",
    "types-usd>=24.5.2",
]
lint = [
    "clang-format>=23.1.3",  # clang-format and clang-tidy check the C++ (pre-commit)
    "clang-tidy>=22.1.8",
    "import-linter[ui]>=2.16",  # ui: `import-linter explore` (the import graph in a browser)
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "ty>=0.0.84",
    { include-group = "stubs" },
]
test = [
    "bpy~=5.2.0",  # one Blender minor: each compiled bridge build binds to its USD namespace
    "bpy-site-packages",
    "filelock>=3.20",  # parallel test workers build the Hydra bridge once (tests/isolated/conftest.py)
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]
# Only for remaking the scene graph widget's row icon masks (tools/row_icon_masks.py), with `dev`:
# `uv run --group icons python tools/row_icon_masks.py`. resvg_py's wheels hold resvg, a self-contained renderer,
# which returns PNG bytes; pypng, pure Python, decodes them.
icons = [
    "pypng>=0.20220715",
    "resvg_py>=0.5.0",
]
dev = [
    { include-group = "build" },
    { include-group = "lint" },
    { include-group = "test" },
]

# Development commands. They import from tools/, which only the editable install puts on sys.path.
[project.scripts]
proscenium-blender = "launch_blender:main"  # build, then run Blender with Proscenium enabled (tools/launch_blender.py)
proscenium-build = "build_extension:main"  # dist/proscenium-<version>.zip (tools/build_extension.py)
proscenium-matrix = "matrix:main"  # check or render the requirement matrix (tools/matrix.py)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proscenium"]
# The editable install adds tools/ to sys.path beside src/, for [project.scripts].
dev-mode-dirs = ["src", "tools"]

# uv's Python, never system Python, to ensure the platform always matches in testing (macOS)
[tool.uv]
python-preference = "only-managed"

# Library packages the extension bundles as wheels (packages/README.md)
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bpy-site-packages = { path = "tools/bpy-site-packages" }
proscenium_cook = { workspace = true }
proscenium_sync = { workspace = true }
proscenium_ui = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "packages/*/src", "tools", "tools/feasibility", "tests"]

[tool.ruff.lint]
future-annotations = true
select = ["E", "W", "F", "I", "A", "ANN", "B", "UP", "TC", "PERF", "N818", "D", "D415", "RUF022", "C901", "TID252"]
ignore = [
    "ANN401", # Any is the honest type for untyped pxr/bpy objects
    "D105", "D107", # a magic method or __init__ is described by its class
    "D401", # a docstring says what a function gives ("The binding's stages ..."), as its name does
    "D400", # D415 instead: a summary can be a question, as a probe's is
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D102", "D103"] # a test's name says what it checks
"tools/feasibility/**/*.py" = ["D101", "D102", "D103"] # M1's evidence code, kept as it was measured
"{tests,tools}/**/*.py" = ["C901"] # only test complexity on code that ships
# Blender installs the extension as bl_ext.<repository>.proscenium, so it can't import its own modules absolutely.
"src/proscenium/**/*.py" = ["TID252"]

# Relative imports reach only a sibling or a descendant; any other import is absolute.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["proscenium", "proscenium_cook", "proscenium_sync", "proscenium_ui"]
known-third-party = ["bpy", "pxr"]

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["tools", "tools/feasibility", "tests"]

[tool.ty.src]
exclude = [".claude"]  # Claude Code's worktrees, each a copy of the repository

# Beyond ty's defaults. The pre-commit hook passes --error-on-warning, so warnings fail it too.
[tool.ty.rules]
missing-override-decorator = "error"  # every override is marked with typing.override
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
missing-type-argument = "error"  # every generic is parametrized
blanket-ignore-comment = "error"  # every ty: ignore names its rule
disjoint-cast = "error"
division-by-zero = "error"
invalid-legacy-positional-parameter = "error"
unsupported-dynamic-base = "error"
missing-direct-dependency = "error"

[[tool.ty.overrides]]
include = ["tools/feasibility/**"]  # M1's evidence code, kept as it was measured

[tool.ty.overrides.rules]
missing-type-argument = "ignore"

[tool.pyright]
# Pylance configuration
extraPaths = ["tools", "tools/feasibility", "tests"]

# The extension's import rules, and the rules between the workspace's packages (packages/README.md#import-rules). 
# Each library package's own rules are in its pyproject.toml. Tests and tools are no root package, so they reach 
# into any module.
[tool.importlinter]
root_packages = ["proscenium", "proscenium_cook", "proscenium_sync", "proscenium_ui"]
include_external_packages = true  # so the bpy-free contract sees Blender's modules

# The extension's import layers, highest first. Exhaustive: a module beside the units that no import layer lists fails.
[[tool.importlinter.contracts]]
name = "The extension's import layers"
type = "layers"
containers = ["proscenium"]
layers = ["addon", "interface"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "The extension's units' modules import each other without cycles"
type = "acyclic_siblings"
ancestors = ["proscenium.*"]

[[tool.importlinter.contracts]]
name = "Other packages use proscenium_sync's API: its own names"
type = "protected"
protected_modules = ["proscenium_sync.*"]
allowed_importers = ["proscenium_sync"]

[[tool.importlinter.contracts]]
name = "Other packages use proscenium_ui's API: the widgets' displays, and widget_updates for scheduling outside a draw"
type = "protected"
protected_modules = ["proscenium_ui.*"]
allowed_importers = ["proscenium_ui"]
ignore_imports = [
    "proscenium.** -> proscenium_ui.scene_graph_widget.display",
    "proscenium.** -> proscenium_ui.property_viewer_widget.display",
    "proscenium.** -> proscenium_ui.widget_updates",
]

[[tool.importlinter.contracts]]
name = "Other packages use proscenium_cook's API: its own names"
type = "protected"
protected_modules = ["proscenium_cook.*"]
allowed_importers = ["proscenium_cook"]

# The dependencies their pyproject.toml files declare: the extension above the library packages, which import none of
# the others.
[[tool.importlinter.contracts]]
name = "The packages' import layers"
type = "layers"
layers = ["proscenium", "proscenium_sync | proscenium_ui | proscenium_cook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]  # tests/ for the support and fixtures packages
# importlib mode lets test files in different layers share a basename.
addopts = ["--strict-markers", "--import-mode=importlib"]
# bpy_free, blender, and isolated are applied from the test's directory (tests/conftest.py).
markers = [
    "bpy_free: reads and writes no Blender data, so it needs no reset",
    "blender: in-process bpy wheel, reused process with explicit state reset",
    "isolated: fresh Blender process (bpy wheel or binary) per test",
    "alab: requires PROSCENIUM_ALAB_ROOT",
    "slow: long-running",
    "windowed: opens a Blender window; covers=(...) names what it tests, so a local run skips it until that changes",
]
