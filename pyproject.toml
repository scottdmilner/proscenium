[project]
name = "proscenium"
version = "0.1.0"
description = "Blender extension for one-way synchronization of composed OpenUSD stages into Blender"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# Runtime dependencies are distributed with the extension. Keep this empty
# unless a package is meant to ship.
dependencies = []

[dependency-groups]
dev = [
    "bpy~=5.2.0",  # one Blender minor: each compiled bridge build binds to its USD namespace
    "bpy-site-packages",
    "clang-format>=23.1.3",  # clang-format and clang-tidy check the compiled core (pre-commit)
    "clang-tidy>=22.1.8",
    "cmake>=3.26",  # cmake and ninja build compiled modules (tools/native_build.py)
    "fake-bpy-module-5-2>=20260730",
    "ninja>=1.13.2",
    "packaging>=26.3",
    "pre-commit>=4.6.2",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "types-pyyaml>=6.0.12.20260906",
    "types-usd>=24.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proscenium"]

[tool.uv.sources]
bpy-site-packages = { path = "tools/bpy-site-packages" }

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tools", "tools/feasibility", "tests"]

[tool.ruff.lint]
future-annotations = true
select = ["E", "W", "F", "I", "A", "ANN", "B", "UP", "TC", "PERF", "N818", "D", "D415", "RUF022"]
ignore = [
    "ANN401", # Any is the honest type for untyped pxr/bpy objects
    "D105", "D107", # a magic method or __init__ is described by its class
    "D401", # a docstring says what a function gives ("The binding's stages ..."), as its name does
    "D400", # D415 instead: a summary can be a question, as a probe's is
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D102", "D103"] # a test's name says what it checks
"tools/feasibility/**/*.py" = ["D101", "D102", "D103"] # M1's evidence code, kept as it was measured

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["proscenium"]
known-third-party = ["bpy", "pxr"]

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["tools", "tools/feasibility", "tests"]

[tool.ty.rules]
missing-override-decorator = "error"  # every override is marked with typing.override
possibly-missing-attribute = "error"

[tool.pyright]
# Pylance configuration
extraPaths = ["tools", "tools/feasibility", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]  # tests/ for the support and fixtures packages
# importlib mode lets test files in different layers share a basename.
addopts = ["--strict-markers", "--import-mode=importlib"]
# bpy_free, blender, and isolated are applied from the test's directory (tests/conftest.py).
markers = [
    "bpy_free: runs without Blender; Blender modules are blocked",
    "blender: in-process bpy wheel, reused process with explicit state reset",
    "isolated: fresh Blender process (bpy wheel or binary) per test",
    "alab: requires PROSCENIUM_ALAB_ROOT",
    "slow: long-running",
]
