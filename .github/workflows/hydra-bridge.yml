# Compiled Hydra bridge (M1b). Copy the uploaded results into docs/feasibility/runtime-record.md.
#
# Each platform builds against the headers Blender v5.2.2 pins, audits the module's
# linkage (build.py), and runs the same checks in the bpy wheel and the Blender binary (run.py),
# then the Phase E measurement harness on one small scene (measure/run.py). Each build job also packages
# Proscenium's extension zip with the module (distribution.py); the distribution jobs install that zip into
# Blender on a fresh runner given only the zip (M1b Phase F).
name: Hydra bridge

on:
  workflow_dispatch:
  # Manual dispatch needs the file on the default branch; until then, pushing a change to the
  # bridge on an M1b branch runs it.
  push:
    branches: ["m01b-*"]
    paths:
      - "tools/feasibility/hydra_bridge/**"
      - ".github/workflows/hydra-bridge.yml"
      - "src/proscenium/**"

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-blender
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: tools/feasibility/hydra_bridge/external
          key: hydra-bridge-deps-${{ runner.os }}-${{ hashFiles('tools/feasibility/hydra_bridge/prepare_deps.py', 'uv.lock') }}
      - name: Build and audit
        run: uv run python tools/feasibility/hydra_bridge/build.py
      - name: Package the extension zip
        run: uv run python tools/feasibility/hydra_bridge/distribution.py package
      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: proscenium-macos-arm64
          path: build/hydra-bridge/dist/*.zip
          if-no-files-found: error
      - name: Checks in the wheel and the binary
        run: uv run python tools/feasibility/hydra_bridge/run.py
      # Keeps the Phase E harness working; shared runners make its numbers unreliable, so none are recorded.
      - name: Measurement harness, one small scene
        run: uv run python tools/feasibility/hydra_bridge/measure/run.py --scenes smoke --repeats 1 --settle 0.2
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-bridge-macos-arm64
          path: build/hydra-bridge/
          if-no-files-found: warn

  # Built on Blender's glibc floor (manylinux_2_28, GCC 14), then tested on a current distribution.
  # Unlike macOS (deployment target) and Windows (pinned MSVC toolset), Linux has no compiler setting
  # for an older floor: the build host's glibc and libstdc++ set the symbol versions. The manylinux
  # image lacks the desktop libraries bpy and the Blender binary load, so the tests run in a second job.
  linux-build:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    steps:
      - run: command -v git || dnf install -y git
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: tools/feasibility/hydra_bridge/external
          key: hydra-bridge-deps-Linux-${{ hashFiles('tools/feasibility/hydra_bridge/prepare_deps.py', 'uv.lock') }}
      - name: Build and audit
        run: uv run python tools/feasibility/hydra_bridge/build.py
      - name: Package the extension zip
        run: uv run python tools/feasibility/hydra_bridge/distribution.py package
      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: proscenium-linux-x64
          path: build/hydra-bridge/dist/*.zip
          if-no-files-found: error
      - name: Upload module
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-bridge-linux-x64-build
          path: build/hydra-bridge/
          if-no-files-found: warn

  linux-test:
    needs: linux-build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-blender
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: hydra-bridge-linux-x64-build
          path: build/hydra-bridge/
      - name: Checks in the wheel and the binary
        run: uv run python tools/feasibility/hydra_bridge/run.py
      # Keeps the Phase E harness working; shared runners make its numbers unreliable, so none are recorded.
      - name: Measurement harness, one small scene
        run: uv run python tools/feasibility/hydra_bridge/measure/run.py --scenes smoke --repeats 1 --settle 0.2
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-bridge-linux-x64
          path: build/hydra-bridge/
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-blender
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: tools/feasibility/hydra_bridge/external
          key: hydra-bridge-deps-${{ runner.os }}-${{ hashFiles('tools/feasibility/hydra_bridge/prepare_deps.py', 'uv.lock') }}
      # build.py loads the pinned MSVC toolset (14.44, matching Blender's usd_ms.dll and CRT) itself,
      # through Visual Studio's vswhere and vcvarsall.
      - name: Build and audit
        run: uv run python tools/feasibility/hydra_bridge/build.py
      - name: Package the extension zip
        run: uv run python tools/feasibility/hydra_bridge/distribution.py package
      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: proscenium-windows-x64
          path: build/hydra-bridge/dist/*.zip
          if-no-files-found: error
      - name: Checks in the wheel and the binary
        run: uv run python tools/feasibility/hydra_bridge/run.py
      # Keeps the Phase E harness working; shared runners make its numbers unreliable, so none are recorded.
      - name: Measurement harness, one small scene
        run: uv run python tools/feasibility/hydra_bridge/measure/run.py --scenes smoke --repeats 1 --settle 0.2
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydra-bridge-windows-x64
          path: build/hydra-bridge/
          if-no-files-found: warn

  # What a user does with a downloaded release zip: install from disk, restart, use, uninstall. Each runs on a
  # fresh runner with no build tree; the checks run against the installed module.
  distribution:
    needs: [macos, linux-build, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, platform: macos-arm64 }
          - { runner: ubuntu-latest, platform: linux-x64 }
          - { runner: windows-latest, platform: windows-x64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-blender
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: proscenium-${{ matrix.platform }}
          path: build/hydra-bridge/dist/
      - name: Install, use and uninstall in the Blender binary
        run: uv run python tools/feasibility/hydra_bridge/distribution.py install
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.platform }}
          path: build/hydra-bridge/distribution-*
          if-no-files-found: warn
