name: CI

on:
  pull_request:
  # Runs on main fill the caches every pull request can read; a pull request's own caches are visible only to it.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Docs-only pull requests skip the builds and tests. Lint always runs: its matrix hook checks docs/. A skipped job
  # counts as passing for required status checks. Pushes to main and manual runs always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # A pull request's checkout is a merge commit: its first parent is the base, so HEAD^1..HEAD is what the
      # pull request changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # Code is any changed file outside docs/ and the root *.md files (README.md, AGENTS.md, CLAUDE.md).
            # READMEs in src/ and tests/ are tested, so they count as code.
            if ! git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|[^/]+\.md$)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked  # fail if uv.lock is out of date
      # clang-tidy parses the compiled core with Blender's dependency headers (tools/clang_tidy.py).
      - uses: ./.github/actions/blender-deps
      # Checks are defined once, in .pre-commit-config.yaml. Fixes made by
      # ruff count as failures here, and the diff is printed.
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  # The compiled core for Linux, built on Blender's glibc floor (manylinux_2_28; see hydra-bridge.yml). The
  # manylinux image lacks the desktop libraries bpy and Blender load, so the Linux tests run in the test job, where
  # tools/build_extension.py uses this module because its build record is current. The Hydra bridge, which M4's
  # prototype tests run, is built here too, since its build audits the same floor.
  core-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    steps:
      - run: command -v git || dnf install -y git
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: ./.github/actions/blender-deps
      - name: Build the compiled core
        run: uv run python tools/build_extension.py
      - name: Build the Hydra bridge
        run: uv run python tools/feasibility/hydra_bridge/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: core-linux-x64
          path: |
            build/core/build.json
            src/proscenium/core/_core.*.so
            build/hydra-bridge/build.json
            build/hydra-bridge/_hydra_bridge.*.so
          if-no-files-found: error

  test:
    needs: [changes, core-linux]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-blender  # binary smoke tests in tests/isolated, and its windowed tests
        with:
          window: "true"
      - run: uv sync --locked
      - uses: ./.github/actions/blender-deps
        if: runner.os != 'Linux'
      - uses: actions/download-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: core-linux-x64

      # Before the tests: it syncs src/proscenium/wheels (gitignored) from uv.lock and builds the compiled core
      # (on Linux, it keeps core-linux's), which the extension test's read-only build (--check mode) needs.
      - name: Build extension
        run: uv run python tools/build_extension.py

      - name: Tests
        env:
          PROSCENIUM_REQUIRE_BLENDER: "1"  # fail, rather than skip, binary tests without a binary
          # Linux uses core-linux's bridge; elsewhere tests/isolated/conftest.py builds it.
          PROSCENIUM_HYDRA_BRIDGE: ${{ runner.os == 'Linux' && 'build/hydra-bridge' || '' }}
        # On Linux, under a virtual display, where the windowed tests' Blender windows open.
        run: >
          ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"' || '' }}
          uv run pytest -n auto

      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.os }}
          path: dist/*.zip
