name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked  # fail if uv.lock is out of date
      # Checks are defined once, in .pre-commit-config.yaml. Fixes made by
      # ruff count as failures here, and the diff is printed.
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-blender  # binary smoke tests in tests/isolated
      - run: uv sync --locked

      # Before the tests: it syncs src/proscenium/wheels (gitignored) from uv.lock, which
      # the extension test's read-only build (--check mode) needs.
      - name: Build extension
        run: uv run python tools/build_extension.py

      - name: Tests
        env:
          PROSCENIUM_REQUIRE_BLENDER: "1"  # fail, rather than skip, binary tests without a binary
        run: uv run pytest -n auto

      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.os }}
          path: dist/*.zip
