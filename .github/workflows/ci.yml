name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked  # fail if uv.lock is out of date
      # Checks are defined once, in .pre-commit-config.yaml. Fixes made by
      # ruff count as failures here, and the diff is printed.
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  # The compiled core for Linux, built on Blender's glibc floor (manylinux_2_28; see hydra-bridge.yml). The
  # manylinux image lacks the desktop libraries bpy and Blender load, so the Linux tests run in the test job, where
  # tools/build_extension.py uses this module because its build record is current.
  core-linux:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    steps:
      - run: command -v git || dnf install -y git
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: build/blender-deps
          key: blender-deps-Linux-${{ hashFiles('tools/blender_deps.py', 'uv.lock') }}
      - name: Build the compiled core
        run: uv run python tools/build_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: core-linux-x64
          path: |
            build/core/build.json
            src/proscenium/core/_core.*.so
          if-no-files-found: error

  test:
    needs: core-linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-blender  # binary smoke tests in tests/isolated
      - run: uv sync --locked
      - uses: actions/cache@v4
        if: runner.os != 'Linux'
        with:
          path: build/blender-deps
          key: blender-deps-${{ runner.os }}-${{ hashFiles('tools/blender_deps.py', 'uv.lock') }}
      - uses: actions/download-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: core-linux-x64

      # Before the tests: it syncs src/proscenium/wheels (gitignored) from uv.lock and builds the compiled core
      # (on Linux, it keeps core-linux's), which the extension test's read-only build (--check mode) needs.
      - name: Build extension
        run: uv run python tools/build_extension.py

      - name: Tests
        env:
          PROSCENIUM_REQUIRE_BLENDER: "1"  # fail, rather than skip, binary tests without a binary
        run: uv run pytest -n auto

      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.os }}
          path: dist/*.zip
