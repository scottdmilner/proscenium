[project]
name = "bpy-site-packages"
version = "0.1.0"
description = "Expose the site-packages bundled inside the bpy wheel (pxr, MaterialX, OpenImageIO, ...) on sys.path"
requires-python = ">=3.13"
dependencies = ["bpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["_bpy_site_packages.py", "bpy_site_packages.pth"]
